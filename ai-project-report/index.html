<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI项目官网｜AI优先执行机制与下一阶段目标</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f3f6f7;color:#132531;display:grid;place-items:center;min-height:100vh}.loading{max-width:min(720px,calc(100vw - 48px));padding:24px 28px;background:#fff;border:1px solid #dbe4e8;border-radius:16px;box-shadow:0 16px 42px rgba(25,48,61,.075);line-height:1.7}.sub{margin-top:8px;color:#6b7f8b;font-size:14px}</style></head><body><div class="loading">正在加载报告…<div class="sub">首次打开需要读取并解压报告文件，请稍候。</div></div><script>
(async()=>{try{const names=["part1.txt?v=20260819-1325","part2.txt?v=20260819-1325","part3.txt?v=20260819-1325","part4.txt?v=20260819-1325"];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:"no-store"});if(!r.ok)throw new Error(n+" 请求失败（"+r.status+"）");return await r.text()}));let b64=parts.join("").replace(/[^A-Za-z0-9+/=_-]/g,"").replace(/-/g,"+").replace(/_/g,"/");b64=b64.replace(/=+$/g,"")+"=".repeat((4-b64.length%4)%4);const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));if(!("DecompressionStream" in window))throw new Error("浏览器版本过旧，请使用最新版 Chrome、Edge 或 Safari");const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));const text=await new Response(stream).text();if(!/<!doctype html/i.test(text.slice(0,100)))throw new Error("报告内容校验失败，请刷新后重试");document.open();document.write(text);document.close();}catch(e){console.error(e);document.body.innerHTML='<div class="loading"><strong>报告加载失败</strong><div class="sub">'+String(e.message||e)+'</div><div class="sub">请按 Command + Shift + R（Windows：Ctrl + F5）强制刷新。</div></div>';}})();
</script></body></html>
