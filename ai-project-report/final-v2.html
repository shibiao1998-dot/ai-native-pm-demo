<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AI项目官网｜AI优先执行机制与下一阶段目标</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f3f6f7;color:#132531;display:grid;place-items:center;min-height:100vh}.loading{width:min(720px,calc(100vw - 48px));padding:24px 28px;background:#fff;border:1px solid #dbe4e8;border-radius:16px;box-shadow:0 16px 42px rgba(25,48,61,.075);line-height:1.7}.title{font-size:18px;font-weight:800}.sub{margin-top:8px;color:#6b7f8b;font-size:14px}.progress{height:5px;margin-top:16px;border-radius:999px;background:#e7eef1;overflow:hidden}.bar{width:18%;height:100%;border-radius:inherit;background:#08787b;animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(455%)}}</style></head><body><div class="loading"><div class="title">正在加载报告</div><div class="sub">正在打开正式汇报版，请稍候。</div><div class="progress"><div class="bar"></div></div></div><script>(async()=>{const fail=e=>{console.error(e);document.body.innerHTML='<div class="loading"><div class="title">报告加载失败</div><div class="sub">'+String(e&&e.message?e.message:e)+'</div></div>'};try{const build='formal-v3-20260819';const expected=[3000,3000,3000,3000,3000,3000,3000,3000,3000,1656];const parts=await Promise.all(expected.map(async(len,i)=>{const name=`payload-v3-${String(i+1).padStart(2,'0')}.b64?v=${build}`;const r=await fetch(name,{cache:'no-store'});if(!r.ok)throw new Error(`报告文件 ${i+1} 请求失败（${r.status}）`);const t=(await r.text()).trim();if(t.length!==len)throw new Error(`报告文件 ${i+1} 长度异常（${t.length}/${len}）`);if(/[^A-Za-z0-9+/=]/.test(t))throw new Error(`报告文件 ${i+1} 内容异常`);return t}));const b64=parts.join('');if(b64.length!==28656)throw new Error(`报告总长度异常（${b64.length}/28656）`);const bin=atob(b64);const gz=Uint8Array.from(bin,c=>c.charCodeAt(0));if(gz[0]!==31||gz[1]!==139)throw new Error('报告压缩数据异常');if(!('DecompressionStream'in window))throw new Error('浏览器版本过旧，请使用最新版 Chrome、Edge 或 Safari');const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!/^<!doctype html>/i.test(html.trimStart()))throw new Error('报告 HTML 格式校验失败');document.open();document.write(html);document.close()}catch(e){fail(e)}})();</script></body></html>
