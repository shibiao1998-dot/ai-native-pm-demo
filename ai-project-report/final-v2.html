<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>AI项目官网｜AI优先执行机制与下一阶段目标</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f3f6f7;color:#132531;display:grid;place-items:center;min-height:100vh}.loading{width:min(720px,calc(100vw - 48px));padding:24px 28px;background:#fff;border:1px solid #dbe4e8;border-radius:16px;box-shadow:0 16px 42px rgba(25,48,61,.075);line-height:1.7}.title{font-size:18px;font-weight:800}.sub{margin-top:8px;color:#6b7f8b;font-size:14px}.progress{height:5px;margin-top:16px;border-radius:999px;background:#e7eef1;overflow:hidden}.bar{width:18%;height:100%;border-radius:inherit;background:#08787b;animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(455%)}}</style></head><body><div class="loading"><div class="title">正在加载报告</div><div class="sub">正在校验并打开完整 HTML 文件，请稍候。</div><div class="progress"><div class="bar"></div></div></div><script>
(async()=>{const fail=e=>{console.error(e);document.body.innerHTML='<div class="loading"><div class="title">报告加载失败</div><div class="sub">'+String(e&&e.message?e.message:e)+'</div><div class="sub">请等待 GitHub Pages 完成更新后，再按 Command + Shift + R（Windows：Ctrl + F5）强制刷新。</div></div>'};try{const build='20260819-final-v2';const expected=[3000,3000,3000,3000,3000,3000,3000,3000,3000,2304];const names=expected.map((_,i)=>`payload-v2-${String(i+1).padStart(2,'0')}.b64?v=${build}`);const parts=await Promise.all(names.map(async(name,i)=>{const r=await fetch(name,{cache:'no-store'});if(!r.ok)throw new Error(`报告文件 ${i+1} 请求失败（${r.status}）`);const text=(await r.text()).trim();if(text.length!==expected[i])throw new Error(`报告文件 ${i+1} 长度不正确（${text.length} / ${expected[i]}）`);if(/[^A-Za-z0-9+/=]/.test(text))throw new Error(`报告文件 ${i+1} 含有非法字符`);return text}));const b64=parts.join('');if(b64.length!==29304)throw new Error(`报告总长度不正确（${b64.length} / 29304）`);const hex=buffer=>Array.from(new Uint8Array(buffer),b=>b.toString(16).padStart(2,'0')).join('');const b64Hash=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(b64)));if(b64Hash!=='4cb8476a5375f529f30a3f95580709be2f8d7d0bacc09b263d33a728b9c0d20b')throw new Error('报告文件完整性校验未通过');const bin=atob(b64);const gz=Uint8Array.from(bin,c=>c.charCodeAt(0));const gzHash=hex(await crypto.subtle.digest('SHA-256',gz));if(gzHash!=='ab0e225fb705720f7f8bd3cc48dc8b9f299b7506cf7e77990a1da43541ca224c')throw new Error('报告压缩数据校验未通过');if(!('DecompressionStream'in window))throw new Error('浏览器版本过旧，请使用最新版 Chrome、Edge 或 Safari');const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const htmlHash=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)));if(htmlHash!=='f5b9919a21ab95210c8dc12b5deb57d6f54978f9e7b45e670ea38bdc703d2cbc')throw new Error('最终 HTML 内容校验未通过');if(!/^<!DOCTYPE html>/i.test(html.trimStart()))throw new Error('最终 HTML 格式校验未通过');document.open();document.write(html);document.close()}catch(e){fail(e)}})();
</script></body></html>
